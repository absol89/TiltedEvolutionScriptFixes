<div [@fadeInOutActive]="isShown | async" class="group-container-wrapper">
  <div
    *ngIf="group$ | async"
    class="group-container"
    [ngStyle]="positionStyle | async"
    [ngClass]="{
      'layout-classic': (settings.partyLayout | async) === partyLayout.CLASSIC,
      'layout-compact': (settings.partyLayout | async) === partyLayout.COMPACT
    }"
  >
    <div
      *ngFor="let player of groupMembers$ | async"
      [title]="player.cellName"
      class="group-member"
      [class.not-loaded]="!player.isLoaded"
    >
      <img
        *ngIf="settings.partyShowAvatar | async"
        class="member-avatar"
        [src]="player.avatar || defaultAvatar"
        [alt]="player.name"
        draggable="false"
      />
      <div class="member-details">
        <div class="member-header">
          <b
            *ngIf="
              (settings.partyShowLevel | async) && player.level !== undefined
            "
            class="group-member-level"
            >{{ player.level }}
          </b>
          <div *ngIf="player.health === 0" class="group-member-dead"></div>
          <div *ngIf="player.isOwner" class="group-member-leader"></div>
          <span *ngIf="settings.partyShowName | async" class="member-name-wrap">
            <span class="member-name">{{ player.name }}</span>
            <span *ngIf="player.isLocal" class="member-self">(You)</span>
          </span>
        </div>
        <div
          *ngIf="
            (settings.partyShowHealth | async) &&
            player.health !== undefined &&
            player.isLoaded
          "
          class="group-member-health"
        >
          <div
            class="group-member-health-value"
            [app-health]="player.health"
          ></div>
        </div>
      </div>
    </div>
  </div>
</div>
