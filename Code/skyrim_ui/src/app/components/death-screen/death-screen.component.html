<div class="death-screen" *ngIf="isVisible$ | async">
  <div class="death-overlay"></div>
  <div class="death-content">
    <h1 class="death-title">You Died</h1>

    <div class="death-message">
      <p *ngIf="!(isRespawnButtonEnabled$ | async)">
        Please wait
        <span class="timer">{{ secondsRemaining$ | async }}</span> seconds to
        respawn at the entrance
      </p>
      <p *ngIf="isRespawnButtonEnabled$ | async">
        You can now respawn at the entrance
      </p>
      <p class="or-text">or</p>
      <p>Wait for your party to heal you</p>
    </div>

    <button
      class="respawn-button"
      *ngIf="isRespawnButtonEnabled$ | async"
      (click)="onRespawnClicked()"
    >
      Respawn at Entrance
    </button>

    <div class="healing-message" *ngIf="!(isRespawnButtonEnabled$ | async)">
      <p>Cooldown: {{ secondsRemaining$ | async }}s</p>
    </div>
  </div>
</div>
