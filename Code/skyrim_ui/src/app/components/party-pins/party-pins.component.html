<div class="party-pins-layer" *ngIf="pins.length > 0">
  <ng-container *ngFor="let pin of pins">
    <div
      class="pin"
      [ngClass]="{ 'oob': pin.oob }"
      [style.left.px]="pin.x"
      [style.top.px]="pin.y"
    ></div>
    <div
      class="label"
      [style.left.px]="pin.x + 10"
      [style.top.px]="pin.y - 14"
      *ngIf="pin.name"
    >
      {{ pin.name }}
    </div>
  </ng-container>
</div>
